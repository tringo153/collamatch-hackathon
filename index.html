<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SynCo - Find Your Perfect Project Partner</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/styles.css">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body class="font-inter bg-gray-50 min-h-screen">
    <!-- Navigation Bar -->
    <nav id="navbar" class="bg-white shadow-sm fixed top-0 w-full z-50"></nav>

    <!-- Main Content - Browse Screen (default) -->
    <main class="pt-20 pb-24">
        <!-- Browse content will be rendered by Browse.init() -->
    </main>

    <!-- Modal Container -->
    <div id="modal-container"></div>

    <!-- Match Popup -->
    <div id="match-popup" class="fixed inset-0 bg-black/60 flex items-center justify-center z-50 hidden"></div>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 w-full bg-white border-t border-gray-200 px-6 py-3">
        <div class="max-w-md mx-auto flex justify-around items-center">
            <button class="nav-btn p-2 text-indigo-600" data-page="discover">
                <i class="ph ph-compass text-2xl"></i>
                <span class="text-xs mt-1 block">Discover</span>
            </button>
            <button class="nav-btn p-2 text-gray-400" data-page="matches">
                <i class="ph ph-heart text-2xl"></i>
                <span class="text-xs mt-1 block">Matches</span>
            </button>
            <button class="nav-btn p-2 text-gray-400" data-page="chats">
                <i class="ph ph-chat-circle text-2xl"></i>
                <span class="text-xs mt-1 block">Chats</span>
            </button>
            <button class="nav-btn p-2 text-gray-400" data-page="profile">
                <i class="ph ph-user text-2xl"></i>
                <span class="text-xs mt-1 block">Profile</span>
            </button>
        </div>
    </nav>

    <!-- Scripts -->
    <script src="js/data.js"></script>
    <script src="js/components/navbar.js"></script>
    <script src="js/components/card.js"></script>
    <script src="js/components/modal.js"></script>
    <script src="js/components/swiper.js"></script>
    <script src="js/components/chat.js"></script>
    <script src="js/components/signup.js"></script>
    <script src="js/components/browse.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
